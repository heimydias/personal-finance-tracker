personal-finance-tracker:
  datasource:
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 1
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    clean-disabled: false
    validate-on-migrate: true

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  jwt:
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
    access-token:
      secret: ${JWT_ACCESS_TOKEN_SECRET}
      expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES}
    refresh-token:
      secret: ${JWT_REFRESH_TOKEN_SECRET}
      expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}

  springdoc:
    swagger-ui:
      enabled: true
  openapi-servers-urls: http://localhost:${server.port}${server.servlet.context-path}, http://127.0.0.1:${server.port}${server.servlet.context-path}